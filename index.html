<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dashboard System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page d-flex justify-content-center align-items-center min-vh-100">

  <div class="card login-card" style="max-width: 400px; width: 100%;">
    <div class="card-header login-card-header text-center py-4">
      <h3 class="mb-0 fw-bold">Welcome Back</h3>
      <p class="mb-0 small opacity-75">Login to access your dashboard</p>
    </div>
    <div class="card-body p-4">
      <div id="loginFeedback"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>
        <button type="button" class="btn btn-primary w-100 py-2 mt-2" id="loginBtn">Login</button>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted">Demo Credentials: <b>admin</b> / <b>password123</b></small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
